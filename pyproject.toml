[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcc-monitoramento-fv"
version = "0.1.0"
description = "Pipeline reproduzível para monitoramento fotovoltaico orientado por dados"
requires-python = ">=3.11,<3.14"
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
pv-monitor = "pv_monitor.cli:main"
pv-dashboard = "pv_monitor.dashboard:main"
pv-launch = "pv_monitor.launcher:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
